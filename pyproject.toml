[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "siliqun"
version = "2.0.0"
description = "SiliQun — A modular tensor-network simulator for silicon spin qubit quantum computers"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Raad Al-Shehri", email = "ralshehri0468@stu.kau.edu.sa" }
]
keywords = [
    "quantum computing",
    "silicon spin qubits",
    "tensor networks",
    "MPS",
    "MPO",
    "quantum simulation",
    "quantum noise",
    "reinforcement learning",
    "quantum control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "gymnasium>=0.26",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.4",
    "cupy-cuda12x>=12.0",
]
hpc = [
    "quimb>=1.6",
    "cotengra>=0.5",
    "mpi4py>=3.1",
]
pennylane = [
    "pennylane>=0.35",
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.1",
    "black>=23.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "nbsphinx>=0.9",
]
all = [
    "siliqun[gpu,hpc,pennylane,viz,dev]",
]

[project.urls]
Homepage = "https://github.com/ralshehri0468/siliqun"
Documentation = "https://siliqun.readthedocs.io"
Repository = "https://github.com/ralshehri0468/siliqun"
"Bug Tracker" = "https://github.com/ralshehri0468/siliqun/issues"

[project.scripts]
siliqun = "siliqun.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["siliqun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
